feature: 2026-06-03-concurrent-register
created: 2026-06-03
status: approved

steps:
  - action: "兼容 Phase 2 基础函数：修改 openai_bind_email.run_second_half() 的 save_import、interactive_input 与 exchange-code 重试"
    exit_signal: "旧调用方不传新参数仍可运行；worker_pool 可传 save_import=False, interactive_input=False 并拿到 import_data"
    status: done
  - action: "搭建 worker_pool CLI 骨架：实现参数解析、配置加载、preflight、ThreadStdoutRouter.install_once()"
    exit_signal: "python worker_pool.py --help 可运行；-c 8 会报错退出"
    status: done
  - action: "实现邮箱租约：实现 EmailAllocator / EmailLease / 冷却释放"
    exit_signal: "两个线程同时 acquire 不会拿到同一邮箱；release 后冷却期内不可再次 acquire"
    status: done
  - action: "实现结果写入器：实现 ResultWriter.append_account() 与 append_import()"
    exit_signal: "多线程并发写 _all.json 和 imports/import_YYYYMMDD.json 不丢记录、不重复写同一条"
    status: done
  - action: "实现 Phase 2 重试编排：实现 SUB2API 登录、OAuth URL 生成、Phase2Outcome、换邮箱和 300s 总耗时"
    exit_signal: "stub 出 email_already_in_use 时旧 lease error、新 lease 生效；stub 出 exchange-code 500 时会重跑 OAuth"
    status: done
  - action: "实现 worker loop 与 Ctrl+C draining：完整接通 Phase 1 → Phase 2 → complete/cancel → result writer"
    exit_signal: "Phase 1 成功但 Phase 2 失败会保存 fail_phase2 且不增加 full success；Ctrl+C 后不再创建新尝试"
    status: done
  - action: "执行最小验证与清理：运行组件级测试/脚本和手工 -c 1、-c 2、Ctrl+C 验收"
    exit_signal: "所有检查项有明确 pass/fail 结果，未通过项不进入实现完成汇报"
    status: done

