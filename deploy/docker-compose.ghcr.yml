services:
  chatgpt-auto-register:
    image: ${IMAGE:-ghcr.io/songzichen29/chatgpt-auto-register:worker-control-dashboard}
    container_name: chatgpt-auto-register
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${WEB_PORT:-7777}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config.json:/app/config.json
      - ./?.json:/app/?.json
      - ./msoutlook_used.json:/app/msoutlook_used.json
      - ./email_blacklist.json:/app/email_blacklist.json
      - ./icloud_cookies.json:/app/icloud_cookies.json
      - ./results:/app/results
      - ./imports:/app/imports
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).read(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
