name: Build and publish Docker images

on:
  push:
    branches:
      - master
      - main
      - worker-control-dashboard
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App Docker metadata
        id: app_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.app_meta.outputs.tags }}
          labels: ${{ steps.app_meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Helper Docker metadata
        id: helper_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-hotmail-helper
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push helper
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/hotmail-helper
          platforms: linux/amd64
          push: true
          tags: ${{ steps.helper_meta.outputs.tags }}
          labels: ${{ steps.helper_meta.outputs.labels }}
          cache-from: type=gha,scope=hotmail-helper
          cache-to: type=gha,mode=max,scope=hotmail-helper
